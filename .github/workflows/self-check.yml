name: self-check

# Cloudflare deploys main from the git integration on its own schedule, and a red
# run here does not stop it. Marking this a required check on pull requests into
# main is what actually gates a deploy.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships node, and the check has nothing to install.
      - run: node .github/selftest.mjs
